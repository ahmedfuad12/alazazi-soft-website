<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>العزعزي سوفت | ALAZAZI SOFT — حلول رقمية تُبنى لتتطور</title>
  <meta name="description" content="العزعزي سوفت | ALAZAZI SOFT: حلول برمجية ومنتجات رقمية عملية تجمع بين جودة البرمجة ووضوح التصميم.">
  <link rel="icon" href="assets/brand/logo-original.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <meta http-equiv="refresh" content="1;url=ar/index.html">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #040818;
      color: #fff;
      font-family: 'Cairo', system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .splash-card {
      max-width: 460px;
      width: 100%;
      padding: 44px 32px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(14, 26, 68, 0.9) 0%, rgba(6, 12, 34, 0.98) 100%);
      border: 1px solid rgba(0, 210, 255, 0.35);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 210, 255, 0.2);
      backdrop-filter: blur(20px);
    }
    .splash-logo-frame {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }
    .splash-logo {
      height: 52px;
      width: auto;
    }
    .splash-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .splash-subtitle {
      color: #00d2ff;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .splash-loading {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 30px;
    }
    .splash-langs {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
  </style>
  <script>
    (function () {
      var lang = 'ar';
      try {
        lang = localStorage.getItem('alazazi_lang') || (navigator.language || 'ar').slice(0, 2);
      } catch (e) {}
      var target = (lang === 'en' ? 'en' : 'ar') + '/index.html';
      var path = location.pathname;
      if (path.endsWith('/index.html')) {
        path = path.slice(0, -10);
      } else if (!path.endsWith('/')) {
        path = path + '/';
      }
      location.replace(path + target);
    })();
  </script>
</head>
<body>
  <div class="splash-card">
    <div class="splash-logo-frame">
      <img src="assets/brand/logo-original.png" alt="العزعزي سوفت | ALAZAZI SOFT" class="splash-logo">
    </div>
    <div class="splash-title">العزعزي سوفت</div>
    <div class="splash-subtitle">ALAZAZI SOFT</div>
    <p class="splash-loading">جارٍ توجيهك إلى النسخة المناسبة...</p>
    <div class="splash-langs">
      <a href="ar/index.html" class="btn btn-primary btn-sm">العربية</a>
      <a href="en/index.html" class="btn btn-secondary btn-sm">English</a>
    </div>
  </div>
</body>
</html>
