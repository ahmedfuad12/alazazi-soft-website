<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصفحة غير موجودة 404 — العزعزي سوفت | ALAZAZI SOFT</title>
  <link rel="icon" href="assets/brand/logo-original.png" type="image/png">
  <script>
    try {
      var t = localStorage.getItem('alazazi_theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }
    .error-box {
      max-width: 520px;
      padding: 50px 36px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(14, 26, 68, 0.9) 0%, rgba(6, 12, 34, 0.98) 100%);
      border: 1px solid rgba(0, 210, 255, 0.35);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 210, 255, 0.2);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #00d2ff, #0070f3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>
  <div class="error-box">
    <div class="brand-logo-frame" style="margin-bottom: 24px; display: inline-flex;">
      <img src="assets/brand/logo-original.png" alt="العزعزي سوفت" class="brand-logo-img">
    </div>
    <div class="error-code">404</div>
    <h1 style="font-size: 1.6rem; margin-bottom: 12px; color: #fff;">الصفحة المطلوبة غير موجودة</h1>
    <p style="color: #94a3b8; margin-bottom: 30px;">
      قد تكون الصفحة انتقلت أو أن الرابط غير صحيح. يمكنك العودة إلى الصفحة الرئيسية.
    </p>
    <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
      <a href="ar/index.html" class="btn btn-primary">الرئيسية (العربية)</a>
      <a href="en/index.html" class="btn btn-secondary">Home (English)</a>
    </div>
  </div>
</body>
</html>
